          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          case "$GITHUB_REF" in
            refs/tags/v*) INPUT_TAG="${GITHUB_REF#refs/tags/}" ;;
            *) INPUT_TAG="" ;;
          esac
          if [ -n "$INPUT_TAG" ]; then
            {
              echo "tags<<EOF"
              printf '%s\n' "${IMAGE}:intel" "${IMAGE}:${INPUT_TAG}-intel"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "inspect_tag=${IMAGE}:intel" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:dev-intel" >> "$GITHUB_OUTPUT"
            echo "inspect_tag=${IMAGE}:dev-intel" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute build version
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "value=dev" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build and push Intel image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
