name: Create GitHub Release

# Runs only on a pushed protected v* tag. The release image jobs below
# (build, merge, build-cpu, build-rocm, build-intel) are deliberate copies of
# the jobs in docker-publish.yml. They were previously reached through a
# reusable-workflow build-images job; that path is no longer used, and a
# separate tag-triggered workflow could not wait for this release
# job. Inlining keeps the original ordering: no release image is pushed unless
# the release job succeeds (every entry image job needs: release; merge needs
# release and build). YAML anchors are not used because the CI gate's
# workflow parser does not support them. Keep both copies in sync; the only
# intended differences are the needs: edges here and the trigger refs.
on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sudolulo/winnow

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "Disk space freed."

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Set up Python
        run: uv python install 3.13

      - name: Ensure lockfile is current
        run: uv lock

      - name: Resolve tag name
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Strict vMAJOR.MINOR.PATCH[-PRERELEASE]: the tag becomes image tags,
          # build args and release metadata, so reject anything else up front.
          if ! printf '%s' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?' \
            || [ "$(printf '%s' "$TAG" | wc -l)" -ne 0 ]; then
            echo "Refusing to release unexpected tag name." >&2
            exit 1
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        id: changelog
        env:
          VERSION: ${{ steps.tag.outputs.VERSION }}
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "⚠️ CHANGELOG.md not found, using empty notes."
            echo "NOTES=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Literal prefix match on the heading; the version is data, not a regex.
          NOTES=$(awk -v heading="## [${VERSION}]" 'index($0, heading) == 1 {found=1; next} found && /^## \[/{exit} found{print}' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "⚠️ No changelog entry found for version $VERSION."
            echo "NOTES=" >> "$GITHUB_OUTPUT"
          else
            {
              echo "NOTES<<CHANGELOG_EOF"
              echo "$NOTES"
              echo "CHANGELOG_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.TAG }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.NOTES }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const notes = (process.env.RELEASE_NOTES || '').trim();
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag,
              });
              console.log(`Release ${tag} already exists (id ${existing.data.id}), skipping creation.`);
            } catch (err) {
              if (err.status !== 404) throw err;
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `Release ${tag}`,
                body: notes || `Release ${tag}`,
                draft: false,
                prerelease: false,
              });
            }

  build:
    name: Build (linux/amd64)
    runs-on: ubuntu-latest
    needs: release
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo rm -rf "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          docker system prune -af
          df -h

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build version
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "value=dev" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-amd64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: [release, build]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          case "$GITHUB_REF" in
            refs/tags/v*) INPUT_TAG="${GITHUB_REF#refs/tags/}" ;;
            *) INPUT_TAG="" ;;
          esac
          if [ -n "$INPUT_TAG" ]; then
            {
              echo "tags<<EOF"
              printf '%s\n' "${IMAGE}:latest" "${IMAGE}:${INPUT_TAG}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "inspect_tag=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:dev" >> "$GITHUB_OUTPUT"
            echo "inspect_tag=${IMAGE}:dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        env:
          IMAGE_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          # Step outputs arrive through env and become one argv entry each,
          # so no tag or digest value is ever parsed as shell source.
          tag_args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              tag_args+=(-t "$tag")
            fi
          done <<< "$IMAGE_TAGS"
          shopt -s nullglob
          sources=()
          for digest in *; do
            sources+=("${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:${digest}")
          done
          if [ "${#tag_args[@]}" -eq 0 ] || [ "${#sources[@]}" -eq 0 ]; then
            echo "No image tags or digests to merge." >&2
            exit 1
          fi
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Inspect image
        env:
          INSPECT_TAG: ${{ steps.tags.outputs.inspect_tag }}
        run: |
          docker buildx imagetools inspect "$INSPECT_TAG"

      - name: Ensure package is public
        run: |
          gh api -X PATCH /user/packages/container/winnow \
            -f visibility=public || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-cpu:
    name: Build CPU (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo rm -rf "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          docker system prune -af
          df -h

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine CPU image tags
        id: cpu-tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          case "$GITHUB_REF" in
            refs/tags/v*) INPUT_TAG="${GITHUB_REF#refs/tags/}" ;;
            *) INPUT_TAG="" ;;
          esac
          if [ -n "$INPUT_TAG" ]; then
            {
              echo "tags<<EOF"
              printf '%s\n' "${IMAGE}:cpu" "${IMAGE}:${INPUT_TAG}-cpu"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "inspect_tag=${IMAGE}:cpu" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:dev-cpu" >> "$GITHUB_OUTPUT"
            echo "inspect_tag=${IMAGE}:dev-cpu" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute build version
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "value=dev" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build and push CPU image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VARIANT=cpu
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=cpu
          cache-to: type=gha,mode=max,scope=cpu
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: true
          tags: ${{ steps.cpu-tags.outputs.tags }}

      - name: Inspect CPU image
        env:
          INSPECT_TAG: ${{ steps.cpu-tags.outputs.inspect_tag }}
        run: |
          docker buildx imagetools inspect "$INSPECT_TAG"

      - name: Ensure package is public
        run: |
          gh api -X PATCH /user/packages/container/winnow \
            -f visibility=public || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-rocm:
    name: Build ROCm / AMD GPU (amd64)
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo rm -rf "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          docker system prune -af
          df -h

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine ROCm image tags
        id: rocm-tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          case "$GITHUB_REF" in
            refs/tags/v*) INPUT_TAG="${GITHUB_REF#refs/tags/}" ;;
            *) INPUT_TAG="" ;;
          esac
          if [ -n "$INPUT_TAG" ]; then
            {
              echo "tags<<EOF"
              printf '%s\n' "${IMAGE}:rocm" "${IMAGE}:${INPUT_TAG}-rocm"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "inspect_tag=${IMAGE}:rocm" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:dev-rocm" >> "$GITHUB_OUTPUT"
            echo "inspect_tag=${IMAGE}:dev-rocm" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute build version
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "value=dev" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build and push ROCm image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            VARIANT=rocm
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=linux/amd64-rocm
          cache-to: type=gha,mode=max,scope=linux/amd64-rocm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: true
          tags: ${{ steps.rocm-tags.outputs.tags }}

      - name: Inspect ROCm image
        env:
          INSPECT_TAG: ${{ steps.rocm-tags.outputs.inspect_tag }}
        run: |
          docker buildx imagetools inspect "$INSPECT_TAG"

      - name: Ensure package is public
        run: |
          gh api -X PATCH /user/packages/container/winnow \
            -f visibility=public || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-intel:
    name: Build Intel GPU (amd64)
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo rm -rf "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          docker system prune -af
          df -h

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Intel image tags
        id: intel-tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          case "$GITHUB_REF" in
            refs/tags/v*) INPUT_TAG="${GITHUB_REF#refs/tags/}" ;;
            *) INPUT_TAG="" ;;
          esac
          if [ -n "$INPUT_TAG" ]; then
            {
              echo "tags<<EOF"
              printf '%s\n' "${IMAGE}:intel" "${IMAGE}:${INPUT_TAG}-intel"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "inspect_tag=${IMAGE}:intel" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:dev-intel" >> "$GITHUB_OUTPUT"
            echo "inspect_tag=${IMAGE}:dev-intel" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute build version
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "value=dev" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build and push Intel image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            VARIANT=intel
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=linux/amd64-intel
          cache-to: type=gha,mode=max,scope=linux/amd64-intel
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: true
          tags: ${{ steps.intel-tags.outputs.tags }}

      - name: Inspect Intel image
        env:
          INSPECT_TAG: ${{ steps.intel-tags.outputs.inspect_tag }}
        run: |
          docker buildx imagetools inspect "$INSPECT_TAG"

      - name: Ensure package is public
        run: |
          gh api -X PATCH /user/packages/container/winnow \
            -f visibility=public || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
