name: secret-scan

# Scans the FULL git history, not just the working tree: a credential that was
# committed and later deleted is still published, and only a history scan sees it.
# The weekly run exists because new detector rules find old secrets that passed
# when they were first pushed.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        # Pinned to a commit, not a mutable tag: a security job must not silently
        # change what it runs when upstream retags.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan full history for secrets
        # Immutable Gitleaks 8.30.1 image; no downloaded executable in the job.
        # --redact=100 keeps matched values out of the CI log.
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        env:
          # Container actions change HOME; trust only the mounted checkout.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
        with:
          args: git . --redact=100 --no-banner --exit-code 1
